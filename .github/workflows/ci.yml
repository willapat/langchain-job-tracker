name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # Building the LangGraph agent constructs a ChatGoogleGenerativeAI client at
      # import time (agents/job_agent.py, for the langgraph-dev entrypoint), which
      # pydantic-validates that an API key is present even though no test here
      # actually calls the model. A placeholder satisfies that check; no real
      # Gemini credentials are needed to run this suite.
      GOOGLE_API_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run build
